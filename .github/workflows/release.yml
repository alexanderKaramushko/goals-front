name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Релизная версия, пример: v0.4.0'
        required: true
      source_image_tag:
        description: 'Docker-тег образа из CI'
        required: true
      changelog:
        description: 'Описание изменений'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: melkor73/goals-front
      SOURCE_IMAGE_TAG: ${{ inputs.source_image_tag }}
      VERSION: ${{ inputs.version }}
      CHANGELOG: ${{ inputs.changelog }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag Docker image
        run: |
          docker pull "$IMAGE_NAME:$SOURCE_IMAGE_TAG"
          docker tag "$IMAGE_NAME:$SOURCE_IMAGE_TAG" "$IMAGE_NAME:$VERSION"
          docker push "$IMAGE_NAME:$VERSION"

      - name: Create Git tag
        run: |
          git check-ref-format "refs/tags/$VERSION"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$VERSION" -m "$CHANGELOG"
          git push origin "refs/tags/$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.changelog }}
